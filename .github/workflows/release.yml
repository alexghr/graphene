name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Parse version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          tag="v$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > VERSION
          ./devenv shell --quiet --no-reload -- go mod tidy

      - name: Commit version bump
        env:
          REF: ${{ inputs.ref }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION go.mod
          if [ -f go.sum ]; then
            git add go.sum
          fi

          if git diff --cached --quiet; then
            echo "No release metadata changes to commit."
          else
            git commit -m "chore: Release $TAG"
            git push origin "HEAD:$REF"
          fi

      - name: Tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            fi
          fi

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tag_commit="$(git rev-parse "$TAG^{commit}")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Tag $TAG already points at $tag_commit, but HEAD is $head_commit." >&2
              exit 1
            fi
            echo "Tag $TAG already exists at HEAD."
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--draft --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            edit_args=(--draft=true --title "$TAG")
            if [[ "$PRERELEASE" == "true" ]]; then
              edit_args+=(--prerelease=true)
            else
              edit_args+=(--prerelease=false)
            fi
            gh release edit "$TAG" "${edit_args[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi

  artifacts:
    name: Build ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-14

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package
        id: build
        run: |
          ./devenv build --quiet outputs.graphene > out.json
          out_dir="$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./out.json))."outputs.graphene"')"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p dist
          asset_name="graphene-$(uname -s)-$(uname -m)"
          cp "${{ steps.build.outputs.out_dir }}/bin/graphene" "dist/$asset_name"
          chmod +x "dist/$asset_name"
          shasum -a 256 "dist/$asset_name" > "dist/$asset_name.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish release
    needs:
      - prepare
      - artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
