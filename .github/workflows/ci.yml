name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-26.04
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Go build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'go.mod') }}-

      - uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'devenv.lock', 'devenv.yaml', 'devenv', 'shell', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-v2-${{ runner.os }}-${{ runner.arch }}-
          paths: ~/.cache/nix

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Materialize devenv shell
        run: ./shell true

      - name: Lint, test, and build
        run: ./shell p-ci

      - name: Build package
        id: build
        run: |
          ./devenv build --quiet outputs.graphene > out.json
          out_dir="$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./out.json))."outputs.graphene"')"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

      - name: Verify Linux binary portability
        run: |
          binary="${{ steps.build.outputs.out_dir }}/bin/graphene"
          file "$binary"
          if file "$binary" | grep -q "dynamically linked"; then
            echo "Linux binary is dynamically linked; rebuild with CGO_ENABLED=0." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifact
          path: ${{ steps.build.outputs.out_dir }}/bin/*
